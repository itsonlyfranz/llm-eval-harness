[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Judge-scored test suites, regression tracking, tracing and a cost/latency dashboard for local LLM agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-eval = "llm_eval_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
